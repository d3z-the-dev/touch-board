name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check & pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip

      - name: Validate metadata
        run: node scripts/validate-metadata.mjs

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run src/schemas

      - name: Pack extension
        run: bash scripts/pack.sh

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: touch-board-shell-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error
