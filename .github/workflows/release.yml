name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Match tag to version-name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare
        run: |
          version="v$(node -p "require('./src/metadata.json')['version-name']")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match metadata version-name ($version)" >&2
            exit 1
          fi

  build:
    name: Validate & pack
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: touch-board-shell-extension
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*.shell-extension.zip
          --title "Touch Board ${GITHUB_REF_NAME}"
          --generate-notes
